# 5g-lab: SD-Core 5G SA (kind 单节点部署 values)
# 基于 aether-onramp deps/5gc/roles/core/templates/sdcore-5g-values.yaml 改造
# PLMN 001/01, TAC 1, 切片 sst=1 sd=010203, DNN internet, UE 池 192.168.100.0/24
# AMF N2 通过节点 IP 172.20.0.2:38412 暴露（kind 网络）

omec-control-plane:
  enable4G: false

5g-ran-sim:
  enable: false

5g-control-plane:
  enable5G: true
  nodeSelectors:
    enabled: false

  kafka:
    deploy: true

  mongodb:
    usePassword: false
    persistence:
      enabled: false
    architecture: replicaset
    replicaCount: 2

  resources:
    enabled: false

  config:
    mongodb:
      name: aether
      url: mongodb://mongodb-headless:27017/?replicaSet=rs0
      authKeysDbName: authentication
      authUrl: mongodb://mongodb-headless:27017/?replicaSet=rs0

    managedByConfigPod:
      enabled: true

    sctplb:
      deploy: false
      ngapp:
        externalIp: 172.20.0.2
        port: 38412

    upfadapter:
      deploy: false

    metricfunc:
      deploy: true
      cfgFiles:
        metricscfg.yaml:
          configuration:
            controllerFlag: false
            userAppApiServer:
              addr: "upf"

    amf:
      ngapp:
        externalIp: 172.20.0.2
      cfgFiles:
        amfcfg.yaml:
          configuration:
            enableDBStore: true
            networkFeatureSupport5GS:
              imsVoPS: 1

    smf:
      cfgFiles:
        smfcfg.yaml:
          configuration:
            enableDBStore: true

    nrf:
      cfgFiles:
        nrfcfg.yaml:
          configuration:
            mongoDBStreamEnable: false
            nfProfileExpiryEnable: true
            nfKeepAliveTime: 60

    webui:
      cfgFiles:
        webuicfg.yaml:
          configuration:
            managedByConfigPod:
              enabled: false

omec-sub-provision:
  enable: true
  nodeSelectors:
    enabled: false

  config:
    simapp:
      cfgFiles:
        simapp.yaml:
          configuration:
            provision-network-slice: true
            sub-provision-endpt:
              addr: webui

            subscribers:
            - ueId-start: "001010000000001"
              ueId-end: "001010000000010"
              plmnId: "00101"
              opc: "8e27b6af0e692e750f32667a3b14605d"
              op: ""
              key: "8baf473f2f8fd09487cccbd7097c6862"
              sequenceNumber: "16f3b3f70fc2"

            device-groups:
            - name: "user-group1"
              imsis:
                - "001010000000001"
                - "001010000000002"
                - "001010000000003"
                - "001010000000004"
                - "001010000000005"
                - "001010000000006"
                - "001010000000007"
                - "001010000000008"
                - "001010000000009"
                - "001010000000010"
              msisdns:
                - "msisdn-0900000001"
                - "msisdn-0900000002"
                - "msisdn-0900000003"
                - "msisdn-0900000004"
                - "msisdn-0900000005"
                - "msisdn-0900000006"
                - "msisdn-0900000007"
                - "msisdn-0900000008"
                - "msisdn-0900000009"
                - "msisdn-0900000010"
              ip-domain-name: "pool1"
              ip-domains:
                - dnn: internet
                  dns-primary: "8.8.8.8"
                  mtu: 1460
                  ue-ip-pool: 192.168.100.0/24
                  ue-dnn-qos:
                    dnn-mbr-downlink: 1000
                    dnn-mbr-uplink: 1000
                    bitrate-unit: Mbps
                    traffic-class:
                      name: "platinum"
                      qci: 9
                      arp: 6
                      pdb: 300
                      pelr: 6
              site-info: "enterprise"

            network-slices:
            - name: "default"
              slice-id:
                sd: "010203"
                sst: 1
              site-device-group:
              - "user-group1"
              application-filtering-rules:
              - rule-name: "ALLOW-ALL"
                priority: 250
                action: "permit"
                endpoint: "0.0.0.0/0"
                traffic-class:
                  qci: 9
                  arp: 6
              site-info:
                gNodeBs:
                - name: "gnb1"
                  tac: 1
                plmn:
                  mcc: "001"
                  mnc: "01"
                site-name: "enterprise"
                upf:
                  upf-name: "upf"
                  upf-port: 8805

omec-user-plane:
  enable: true
  nodeSelectors:
    enabled: false
  resources:
    enabled: false
  config:
    upf:
      name: "aether-upf"
      privileged: true
      sriov:
        enabled: false
      hugepage:
        enabled: false
      enb:
        subnet: 172.20.0.0/16
      access:
        ipam: static
        cniPlugin: macvlan
        iface: eth0
        gateway: 192.168.252.1
        ip: 192.168.252.3/24
      core:
        ipam: static
        cniPlugin: macvlan
        iface: eth0
        gateway: 192.168.250.1
        ip: 192.168.250.3/24
      closedLoop: false
      cfgFiles:
        upf.jsonc:
          mode: af_packet
          hwcksum: true
          log_level: "info"
          measure_upf: true
          measure_flow: true
          gtppsc: true
          ddp: false
          cpiface:
            hostname: "upf"
            enable_ue_ip_alloc: true
            ue_ip_pool: 192.168.100.0/24
          slice_rate_limit_config:
            n6_bps: 10000000000
            n6_burst_bytes: 12500000
            n3_bps: 10000000000
            n3_burst_bytes: 12500000
